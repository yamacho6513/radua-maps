<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111">
<title>RADIA 判定エディター</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#0d0d0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;overflow:hidden}
#bar{position:fixed;z-index:10;left:0;right:0;top:0;padding:calc(7px + env(safe-area-inset-top)) 8px 7px;background:#171719;border-bottom:1px solid #444}
.row{display:flex;gap:6px;align-items:center}.row+ .row{margin-top:6px}button,select{min-height:42px;border:1px solid #555;border-radius:10px;background:#29292d;color:white;font-size:15px;font-weight:650;padding:7px 10px}select{flex:1}
.mode{flex:1}.mode.active{outline:3px solid white}.red{background:#9c2929}.blue{background:#245db8}.erase{background:#555}.move{background:#315c3b}
#status{font-size:11px;color:#bbb;margin-left:4px;white-space:nowrap}
#view{position:fixed;left:0;right:0;top:calc(112px + env(safe-area-inset-top));bottom:calc(66px + env(safe-area-inset-bottom));overflow:hidden;touch-action:none;background:#050505}
#stage{position:absolute;transform-origin:0 0;will-change:transform}#map{position:absolute;left:0;top:0;display:block;user-select:none;-webkit-user-drag:none}#grid{position:absolute;left:0;top:0;touch-action:none}
#foot{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:#171719;border-top:1px solid #444;display:flex;gap:6px}
#foot button{flex:1;min-height:45px}.small{flex:0 0 auto!important}
</style></head><body>
<div id="bar">
 <div class="row"><select id="sel"></select><span id="status">自動保存</span></div>
 <div class="row"><button id="move" class="mode move active">✋ 移動</button><button id="red" class="mode red">■ 赤</button><button id="blue" class="mode blue">■ 青</button><button id="erase" class="mode erase">消す</button></div>
</div>
<div id="view"><div id="stage"><img id="map"><canvas id="grid"></canvas></div></div>
<div id="foot"><button id="undo" class="small">↶ 戻す</button><button id="fit" class="small">全体表示</button><button id="clear" class="small">消去</button><button id="export">判定データを書き出す</button></div>
<script>
const CELL=32, maps=[
{id:"street",name:"東門街",src:"maps/street.png"},{id:"shrine",name:"生田神社",src:"maps/shrine.jpeg"},
{id:"b1",name:"ビル1F",src:"maps/b1.png"},{id:"b2",name:"ビル2F",src:"maps/b2.png"},{id:"bar",name:"BAR",src:"maps/bar.png"}];
const $=q=>document.querySelector(q), sel=$("#sel"),img=$("#map"),cv=$("#grid"),ctx=cv.getContext("2d"),view=$("#view"),stage=$("#stage");
maps.forEach(m=>sel.add(new Option(m.name,m.id)));
let data={};try{data=JSON.parse(localStorage.getItem("radiaCollisionPhone")||"{}")}catch(e){}
let mode="move",scale=1,tx=0,ty=0,hist=[],down=false,last="",pan0=null,pinch0=null;
const M=()=>maps.find(x=>x.id===sel.value), D=()=>data[M().id]||(data[M().id]={});
function save(){localStorage.setItem("radiaCollisionPhone",JSON.stringify(data))}
function transform(){stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function fit(){let s=Math.min(view.clientWidth/img.naturalWidth,view.clientHeight/img.naturalHeight);scale=s;tx=(view.clientWidth-img.naturalWidth*s)/2;ty=(view.clientHeight-img.naturalHeight*s)/2;transform()}
function load(){img.onload=()=>{cv.width=img.naturalWidth;cv.height=img.naturalHeight;stage.style.width=cv.width+"px";stage.style.height=cv.height+"px";fit();draw()};img.src=M().src}
function draw(){ctx.clearRect(0,0,cv.width,cv.height);for(const[k,v]of Object.entries(D())){let[c,r]=k.split(",").map(Number);ctx.fillStyle=v==="red"?"rgba(235,35,35,.52)":"rgba(20,105,255,.58)";ctx.fillRect(c*CELL,r*CELL,CELL,CELL)}
ctx.strokeStyle="rgba(255,255,255,.48)";ctx.lineWidth=Math.max(.5,1/scale);for(let x=0;x<=cv.width;x+=CELL){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.height);ctx.stroke()}for(let y=0;y<=cv.height;y+=CELL){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke()}}
function setMode(m){mode=m;["move","red","blue","erase"].forEach(x=>$("#"+x).classList.toggle("active",x===m))}
["move","red","blue","erase"].forEach(x=>$("#"+x).onclick=()=>setMode(x));
function local(clientX,clientY){let r=view.getBoundingClientRect();return{x:(clientX-r.left-tx)/scale,y:(clientY-r.top-ty)/scale}}
function paint(x,y){let p=local(x,y),c=Math.floor(p.x/CELL),r=Math.floor(p.y/CELL);if(c<0||r<0||c*CELL>=cv.width||r*CELL>=cv.height)return;let k=c+","+r;if(k===last)return;last=k;let d=D(),before=d[k]||null;hist.push({map:M().id,k,before});if(mode==="erase")delete d[k];else d[k]=mode;save();draw()}
view.addEventListener("pointerdown",e=>{view.setPointerCapture(e.pointerId);down=true;last="";if(mode==="move")pan0={x:e.clientX,y:e.clientY,tx,ty};else paint(e.clientX,e.clientY)});
view.addEventListener("pointermove",e=>{if(!down)return;if(mode==="move"&&pan0){tx=pan0.tx+e.clientX-pan0.x;ty=pan0.ty+e.clientY-pan0.y;transform()}else paint(e.clientX,e.clientY)});
view.addEventListener("pointerup",()=>{down=false;pan0=null;last=""});view.addEventListener("pointercancel",()=>{down=false;pan0=null});
view.addEventListener("wheel",e=>{e.preventDefault();let old=scale,n=Math.max(.15,Math.min(5,scale*(e.deltaY<0?1.12:.89)));let r=view.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;tx=mx-(mx-tx)*n/old;ty=my-(my-ty)*n/old;scale=n;transform();draw()},{passive:false});
let touches={};
view.addEventListener("touchstart",e=>{if(mode!=="move"||e.touches.length!==2)return;e.preventDefault();let a=e.touches[0],b=e.touches[1];pinch0={dist:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),scale,tx,ty,cx:(a.clientX+b.clientX)/2,cy:(a.clientY+b.clientY)/2}},{passive:false});
view.addEventListener("touchmove",e=>{if(!pinch0||e.touches.length!==2)return;e.preventDefault();let a=e.touches[0],b=e.touches[1],dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),n=Math.max(.15,Math.min(5,pinch0.scale*dist/pinch0.dist));let r=view.getBoundingClientRect(),mx=pinch0.cx-r.left,my=pinch0.cy-r.top;tx=mx-(mx-pinch0.tx)*n/pinch0.scale;ty=my-(my-pinch0.ty)*n/pinch0.scale;scale=n;transform();draw()},{passive:false});
view.addEventListener("touchend",()=>pinch0=null);
sel.onchange=load;$("#fit").onclick=fit;
$("#undo").onclick=()=>{let h=hist.pop();if(!h)return;let d=data[h.map]||(data[h.map]={});h.before?d[h.k]=h.before:delete d[h.k];save();draw()};
$("#clear").onclick=()=>{if(confirm("このマップだけ全部消しますか？")){data[M().id]={};save();draw()}};
$("#export").onclick=()=>{let blob=new Blob([JSON.stringify({version:2,cellSize:CELL,maps:data},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="radia_collision.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
load();
</script></body></html>
